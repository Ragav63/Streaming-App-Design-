name: Android CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - README.md
      - "**/*.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK (stable name)
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/streaming-app-debug.apk

      - name: Publish APK to "latest" release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Debug Build
          prerelease: true
          files: app/build/outputs/apk/debug/streaming-app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
