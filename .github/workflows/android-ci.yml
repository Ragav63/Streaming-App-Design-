name: Android CI

on:
  push:
    branches: [main]
    # Ignore pushes that only change README or markdown files
    paths-ignore:
      - README.md
      - "**/*.md"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up JDK 17
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Cache Gradle dependencies to speed up builds
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # 4️⃣ Grant execute permission for gradlew
      - name: Grant execute permission
        run: chmod +x ./gradlew

      # 5️⃣ Run unit tests first
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      # 6️⃣ Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --refresh-dependencies

      # 7️⃣ Rename APK to a stable name
      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/streaming-app-debug.apk

      # 8️⃣ Upload APK artifact to CI
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/streaming-app-debug.apk

      # 9️⃣ Publish APK to "latest" GitHub Release
      - name: Publish Latest APK to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Debug Build
          prerelease: true
          files: app/build/outputs/apk/debug/streaming-app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
